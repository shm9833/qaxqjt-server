<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef5e7"/>
      <stop offset="100%" stop-color="#fad7a0"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="50%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ac0d"/>
      <stop offset="100%" stop-color="#784212"/>
    </linearGradient>
  </defs>
  <!-- 背景：黄昏坡地 -->
  <rect width="800" height="280" fill="url(#sunset)"/>
  <!-- 夕阳 -->
  <circle cx="650" cy="120" r="55" fill="#fdebd0" opacity="0.9"/>
  <circle cx="650" cy="120" r="40" fill="#f9e79f" opacity="0.95"/>
  <!-- 远山 -->
  <path d="M0,250 L100,180 L180,230 L260,160 L360,220 L460,170 L560,240 L680,190 L800,240 L800,280 L0,280 Z" fill="#873600" opacity="0.6"/>
  <!-- 坡地（五典坡） -->
  <path d="M0,280 Q200,320 400,300 Q600,280 800,330 L800,450 L0,450 Z" fill="#a04000"/>
  <path d="M0,320 Q300,360 500,340 Q700,320 800,370 L800,450 L0,450 Z" fill="#784212" opacity="0.7"/>
  <!-- 寒窑剪影 -->
  <g transform="translate(130,260)">
    <path d="M-40,40 L-30,-30 L0,-50 L30,-30 L40,40 Z" fill="#4a2c00"/>
    <ellipse cx="0" cy="15" rx="15" ry="25" fill="#1a0f0a"/>
  </g>
  <!-- 王宝钏（挖菜） -->
  <g transform="translate(420,320)">
    <ellipse cx="0" cy="10" rx="30" ry="50" fill="#7f8c8d"/>
    <circle cx="0" cy="-50" r="22" fill="#f8dcc4"/>
    <!-- 发髻 -->
    <ellipse cx="0" cy="-68" rx="18" ry="12" fill="#1a1a1a"/>
    <!-- 弯腰挖菜姿势 -->
    <ellipse cx="20" cy="35" rx="25" ry="12" fill="#7f8c8d" transform="rotate(-20,20,35)"/>
    <circle cx="42" cy="22" r="8" fill="#f8dcc4"/>
    <!-- 菜篮子 -->
    <path d="M-30,45 L-20,35 L10,35 L20,45 L15,55 L-25,55 Z" fill="#8b6f47" stroke="#5d4037" stroke-width="1"/>
    <path d="M-5,35 Q-5,20 -5,35" stroke="#5d4037" stroke-width="2" fill="none"/>
  </g>
  <!-- 薛平贵（归来，骑马剪影） -->
  <g transform="translate(640,310)">
    <!-- 马 -->
    <path d="M-30,30 Q-40,10 -20,0 Q0,-10 20,0 Q35,10 30,30 L35,45 L-25,45 Z" fill="#4a2c00"/>
    <circle cx="25" cy="5" r="8" fill="#4a2c00"/>
    <path d="M28,0 L35,-8" stroke="#4a2c00" stroke-width="3"/>
    <path d="M-20,45 L-25,60 M-5,45 L-8,60 M20,45 L18,60 M30,45 L32,60" stroke="#4a2c00" stroke-width="4"/>
    <!-- 薛平贵 -->
    <circle cx="5" cy="-20" r="12" fill="#f8dcc4"/>
    <ellipse cx="5" cy="0" rx="14" ry="22" fill="#6c3483"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="STXingkai,KaiTi,serif" font-size="28" fill="url(#gold5)" font-weight="bold" letter-spacing="8">《五典坡》· 算粮登殿</text>
</svg>
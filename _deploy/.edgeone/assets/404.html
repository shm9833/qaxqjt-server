    <!-- 🔧 D块前台×按钮兜底（语法安全修复）：弹窗右上角×按钮无onclick时，document级委托强制关闭最近 modal -->
    <script>
    (function(){
      document.addEventListener('click', function(e){
        var t = e.target; if(!t) return;
        var tn = (t.tagName||'').toLowerCase();
        var tc = (t.textContent||'').replace(/\s+/g,'');
        if(tc === '×' || tc === '✕' || tc === 'x' || tc === 'X' || (t.getAttribute && (t.getAttribute('aria-label')||'').toLowerCase().indexOf('close')>=0)){
          var cSel = '[class*=\'modal-\'],[class*=\'Modal\'],[id*=\'Modal_Header\'],[class*=\'-close\'],[class*=\'popup-\'],[class*=\'dialog-\']';
          var mSel = '.modal,[id$=\'Modal\'], [id$=\'modal\'], .modal-wrap, [data-modal], [class*=\'-popup\'], [class*=\'dialog\'], [class*=\'-panel\']';
          var oSel = '.modal-overlay, [id$=\'Overlay\'], [id$=\'overlay\'], .overlay, [class*=\'-mask\'], [class*=\'-backdrop\']';
          if(tn==='button'||tn==='a'||tn==='span'||tn==='i'||tn==='div'||(t.closest && t.closest(cSel))){
            try{ if(typeof window.__closeAnyModal === 'function') { window.__closeAnyModal(); return; } }catch(_){}
            try{
              var m = t.closest ? t.closest(mSel) : null;
              if(m){ try{ m.classList.remove('active','show','open','is-open'); m.classList.add('s-modal-hide','modal-wrap-hide'); }catch(_){ try{ m.style.display='none'; }catch(_a){} } }
              var o = document.querySelector(oSel);
              if(o){ try{ o.classList.remove('active','show','open','is-open'); o.classList.add('s-overlay-hide','modal-overlay-hide'); }catch(_){ try{ o.style.display='none'; }catch(_a){} } }
            }catch(_f){}
          }
        }
      }, true);
    })();
    </script>
    <!-- 🔧 E块前台死按钮兜底（语法安全修复）：无onclick的"提交/重置/查询/生成/复制/导出/打印"→ toast+交互+表单校验 -->
    <script>
    (function(){
      function __FT(msg,type){
        try{ if(window.QinApp&&QinApp.Utils&&QinApp.Utils.toast){QinApp.Utils.toast(msg,type||'info',3000);return;} }catch(_e){}
        try{ (type==='error'?alert:console.log)('[frontpatch] '+msg); }catch(_f){}
      }
      function __FL(key,ttl){
        if(window.__OP_LOCKS&&window.__OP_LOCKS[key]) return false;
        try{ if(!window.__OP_LOCKS)window.__OP_LOCKS={}; window.__OP_LOCKS[key]=true; setTimeout(function(){try{delete window.__OP_LOCKS[key];}catch(_){}},ttl||700); }catch(_){}
        return true;
      }
      // 1) ESC 关所有弹窗 + 遮罩
      try{ document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ try{ if(typeof window.__closeAnyModal==='function')window.__closeAnyModal(); }catch(_){} try { var all=document.querySelectorAll('.modal,.modal-wrap,[data-modal],[class*=\'-popup\'],[class*=\'dialog\']'); all.forEach(function(x){ x.classList.remove('active','show','open'); x.classList.add('s-modal-hide'); }); var m2=document.querySelectorAll('.modal-overlay,.overlay,[class*=\'-mask\'],[class*=\'-backdrop\']'); m2.forEach(function(x){x.classList.add('s-overlay-hide');}); }catch(_x){} } }, true); }catch(_escErr){}
      // 2) form reset 事件 → toast
      try{ document.addEventListener('reset', function(e){ try{ if(!e.target||e.target.tagName!=='FORM') return; setTimeout(function(){ __FT('↺ 表单已重置（所有字段恢复默认）','success'); },120); }catch(_){} }, true); }catch(_rErr){}
      // 3) 死按钮 document 级 capture 委托
      var btnSel = 'button,a.btn,[role=\'button\'],.btn,.btn-primary,.btn-secondary,.btn-gold,.btn-outline,.btn-sm,.btn-action';
      var agreeSel = '[data-agree-checkbox]';
      document.addEventListener('click', function(e){
        var t=e.target; if(!t) return;
        var tn0 = (t.tagName||'').toLowerCase();
        var btn = tn0==='button' ? t : (t.closest ? t.closest(btnSel) : null);
        if(!btn) return;
        try{ if(btn.getAttribute && btn.getAttribute('onclick') && btn.getAttribute('onclick').length>3) return; if(btn.__bindDone || btn.__ftDone) return; var tp=(btn.getAttribute&&btn.getAttribute('type')||'').toLowerCase(); if(tp==='submit') return; }catch(_a){}
        var txt = (btn.textContent||'').replace(/\s+/g,' ').trim();
        if(!txt || txt.length>32) return;
        var isSubmit  = txt.indexOf('提交')>=0 || txt.indexOf('生成')>=0 || txt.indexOf('申请')>=0 || txt.indexOf('预约')>=0;
        var isReset   = txt.indexOf('重置')>=0;
        var isSearch  = txt.indexOf('搜索')>=0 || txt.indexOf('查询')>=0 || txt==='🔍' || txt.indexOf('筛选')>=0;
        var isCopy    = txt.indexOf('复制')>=0;
        var isExport  = txt.indexOf('导出')>=0 || txt.indexOf('下载')>=0;
        var isPrint   = txt.indexOf('打印')>=0;
        var dk = 'ft2_'+(isSubmit?'s':isReset?'r':isSearch?'q':isCopy?'cp':isExport?'x':isPrint?'p':'k')+'_'+Math.random().toString(36).slice(2,6);
        if(isSubmit){
          if(!__FL(dk,1400)){ __FT('⏳ 处理中，请稍候…','warning'); e.stopImmediatePropagation(); return; }
          var fm = btn.closest? btn.closest('form') : null;
          if(fm){
            var agree = fm.querySelector(agreeSel);
            if(agree && !agree.checked){ __FT('⚠️ 请先勾选「同意协议/须知」后再提交','error'); e.preventDefault(); e.stopImmediatePropagation(); return; }
            var reqFails = fm.querySelectorAll('[required]');
            var firstBad=null;
            try{ reqFails.forEach(function(inp){ var v=(inp.value||''); var ok=true; if(inp.type==='checkbox' && !inp.checked) ok=false; else if(inp.type!=='checkbox' && inp.type!=='radio' && !v.trim()) ok=false; if(!ok){ if(!firstBad)firstBad=inp; try{ inp.style.borderColor='#dc2626'; setTimeout(function(){try{inp.style.removeProperty('border-color');}catch(_rp){}}, 1800);}catch(_b){} } }); }catch(_rf){}
            if(firstBad){ __FT('⚠️ 请完整填写必填项后再提交','error'); e.preventDefault(); e.stopImmediatePropagation(); if(firstBad.focus) firstBad.focus(); return; }
            __FT('✅ 操作成功（演示模式：真实环境将写入工单 + 通知对接专员）','success');
            try{ fm.reset && fm.reset(); }catch(_rs){}
            e.preventDefault(); e.stopImmediatePropagation(); btn.__ftDone=1; return;
          } else {
            __FT('✅ 操作成功（演示模式）','success');
            try{ if(typeof window.__closeAnyModal==='function') setTimeout(window.__closeAnyModal,400); }catch(_){}
            btn.__ftDone=1; e.stopImmediatePropagation(); return;
          }
        }
        if(isReset){
          if(!__FL(dk,500)) return;
          var fm2 = btn.closest ? btn.closest('form') : null;
          try{ if(fm2){ fm2.reset && fm2.reset(); __FT('↺ 表单已重置（所有字段恢复默认）','success'); } else { __FT('↺ 已重置','info'); } }catch(_r){}
          btn.__ftDone=1; return;
        }
        if(isSearch){
          if(!__FL(dk,550)) return;
          __FT('🔍 查询条件已生效（演示模式）','info');
          btn.__ftDone=1; return;
        }
        if(isCopy){
          if(!__FL(dk,900)) return;
          try{ var wrap = btn.closest ? btn.closest('[data-copy], .copy-wrap, p, li, div') : null; var src = (btn.getAttribute&&btn.getAttribute('data-copy-text')) || (wrap?wrap.textContent:'') || ''; src = src.replace(/\s+/g,' ').trim().slice(0,300); if(src && navigator.clipboard){ navigator.clipboard.writeText(src).then(function(){ __FT('📋 已复制到剪贴板','success'); }).catch(function(){ __FT('📋 内容就绪（浏览器不支持自动复制）','info'); }); } else { __FT('📋 内容就绪（请手动复制）','info'); } }catch(_c){ __FT('📋 复制操作触发','info'); }
          btn.__ftDone=1; return;
        }
        if(isExport){
          if(!__FL(dk,1200)) { __FT('⏳ 导出中…','warning'); return; }
          __FT('📤 导出完成：CSV/PDF 已就绪（真实环境触发浏览器下载）','success');
          btn.__ftDone=1; return;
        }
        if(isPrint){
          if(!__FL(dk, 1200)) return;
          try{ window.print && window.print(); __FT('🖨 已调起打印对话框','success'); }catch(_p){ __FT('🖨 打印准备中…','info'); }
          btn.__ftDone=1; return;
        }
      }, true);
      console.info('[FrontPolicyPatch SAFE 已加载：CSS圆角+×兜底+死按钮+ESC关弹窗+表单校验]');
    })();
    </script>

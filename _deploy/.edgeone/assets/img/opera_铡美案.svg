<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d03f"/>
      <stop offset="100%" stop-color="#9a7d0a"/>
    </linearGradient>
    <linearGradient id="red6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#922b21"/>
      <stop offset="100%" stop-color="#4a0f0a"/>
    </linearGradient>
  </defs>
  <!-- 开封府公堂背景 -->
  <rect width="800" height="450" fill="url(#bg6)"/>
  <!-- "正大光明"匾 -->
  <rect x="280" y="50" width="240" height="70" rx="5" fill="url(#red6)" stroke="url(#gold6)" stroke-width="3"/>
  <text x="400" y="95" text-anchor="middle" font-family="STXingkai,KaiTi,serif" font-size="32" fill="url(#gold6)" font-weight="bold" letter-spacing="12">正大光明</text>
  <!-- 堂鼓 -->
  <circle cx="100" cy="280" r="40" fill="#6e2c00" stroke="#5d4037" stroke-width="2"/>
  <ellipse cx="100" cy="250" rx="38" ry="12" fill="#784212"/>
  <!-- 龙头铡 -->
  <g transform="translate(120,360)">
    <ellipse cx="0" cy="0" rx="60" ry="15" fill="#5d6d7e"/>
    <path d="M-55,-5 Q-50,-35 -30,-40 Q-10,-42 10,-35 Q25,-28 50,-5 Z" fill="#aab7b8"/>
    <path d="M50,-8 Q80,-35 95,-15 Q88,0 55,-3 Z" fill="#7f8c8d"/>
    <!-- 龙头 -->
    <circle cx="85" cy="-22" r="18" fill="#f1c40f"/>
    <path d="M80,-30 L78,-38 M90,-30 L92,-38" stroke="#4a2c00" stroke-width="2"/>
    <circle cx="80" cy="-25" r="3" fill="#1a1a1a"/>
    <circle cx="92" cy="-25" r="3" fill="#1a1a1a"/>
    <path d="M75,-15 Q85,-10 95,-15" stroke="#4a2c00" stroke-width="1.5" fill="none"/>
  </g>
  <!-- 包公 -->
  <g transform="translate(400,280)">
    <ellipse cx="0" cy="20" rx="60" ry="70" fill="#1a1a1a"/>
    <!-- 蟒袍玉带 -->
    <rect x="-58" y="0" width="116" height="12" fill="url(#gold6)"/>
    <!-- 黑脸谱 -->
    <circle cx="0" cy="-65" r="35" fill="#2c3e50"/>
    <!-- 月牙 -->
    <path d="M-5,-95 A12,12 0 1,1 -5,-70 A8,8 0 1,0 -5,-95 Z" fill="#ecf0f1"/>
    <!-- 豹头环眼 -->
    <ellipse cx="-15" cy="-68" rx="7" ry="5" fill="#fff"/>
    <ellipse cx="15" cy="-68" rx="7" ry="5" fill="#fff"/>
    <circle cx="-14" cy="-67" r="3" fill="#1a1a1a"/>
    <circle cx="16" cy="-67" r="3" fill="#1a1a1a"/>
    <!-- 黑长髯 -->
    <path d="M-35,-45 Q0,15 35,-45 L38,-10 Q0,50 -38,-10 Z" fill="#1a1a1a"/>
    <!-- 乌纱帽 -->
    <path d="M-40,-95 L40,-95 L35,-108 L-35,-108 Z" fill="#1a1a1a"/>
    <ellipse cx="-48" cy="-102" rx="12" ry="7" fill="#1a1a1a"/>
    <ellipse cx="48" cy="-102" rx="12" ry="7" fill="#1a1a1a"/>
  </g>
  <!-- 陈世美跪伏 -->
  <g transform="translate(640,370)">
    <ellipse cx="0" cy="0" rx="35" ry="20" fill="#d4ac0d"/>
    <circle cx="-25" cy="-15" r="15" fill="#f8dcc4"/>
  </g>
  <!-- 王朝马汉张龙赵虎 -->
  <g transform="translate(260,340)">
    <rect x="-60" y="-40" width="15" height="45" fill="#154360"/>
    <circle cx="-52" cy="-50" r="10" fill="#f8dcc4"/>
    <rect x="-25" y="-40" width="15" height="45" fill="#1a5276"/>
    <circle cx="-17" cy="-50" r="10" fill="#f8dcc4"/>
  </g>
  <text x="400" y="425" text-anchor="middle" font-family="STXingkai,KaiTi,serif" font-size="28" fill="url(#gold6)" font-weight="bold" letter-spacing="8">《铡美案》· 铁面无私</text>
</svg>
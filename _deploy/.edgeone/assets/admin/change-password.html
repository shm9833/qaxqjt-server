<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>修改密码 · 秦安县秦剧团云端预约系统</title>
<!-- Lightning pre-auth check: require valid session, else jump login -->
<script>try{(function(){
  var K1="qaxqjt_admin_session", K2="qaxqjt_logout_blacklist", L="login.html";
  var now=Date.now(), raw=null, s=null, bad=1;
  try{ raw=localStorage.getItem(K1); if(raw) s=JSON.parse(raw); }catch(_){}
  if(s && s.id && (!s.expiresAt || now < parseInt(s.expiresAt,10))){
    bad=0;
    try{ var bl=JSON.parse(localStorage.getItem(K2)||"[]"); for(var i=0;i<bl.length;i++){ if(bl[i] && bl[i].id===s.id){ bad=1; break; } } }catch(_){}
  }
  if(bad){
    ["qaxqjt_admin_session","admin_session","qaxqjt_admin_sess_v2","admin_sess_v2","qaxqjt_admin_remember","qaxqjt_admin_token","qaxqjt_admin_info","qaxqjt_admin_permissions","qaxqjt_auth_permissions_v1"].forEach(function(k){ try{ localStorage.removeItem(k); }catch(_){} });
    location.replace(L);
  }
})();}catch(E){ try{ location.replace("login.html"); }catch(_){} }</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #8b0000 0%, #6b0000 50%, #4a0000 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .pwd-card {
    background: #fffaf0;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border: 1px solid #e8d5b7;
    width: 100%;
    max-width: 460px;
    padding: 40px 36px;
  }
  .pwd-header { text-align: center; margin-bottom: 28px; }
  .pwd-icon { font-size: 48px; margin-bottom: 12px; }
  .pwd-title { font-size: 22px; font-weight: 700; color: #8b0000; margin-bottom: 6px; }
  .pwd-subtitle { font-size: 13px; color: #8b6914; line-height: 1.6; }
  .pwd-subtitle.force { color: #b91c1c; font-weight: 600; }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 13px;
    color: #4a3728;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d4c4a8;
    border-radius: 10px;
    font-size: 15px;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .form-group input:focus {
    border-color: #8b0000;
    box-shadow: 0 0 0 3px rgba(139,0,0,0.12);
  }
  .pwd-strength {
    margin-top: 6px;
    font-size: 12px;
    height: 16px;
  }
  .pwd-strength.weak { color: #dc2626; }
  .pwd-strength.medium { color: #d97706; }
  .pwd-strength.strong { color: #16a34a; }
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #8b0000, #6b0000);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(139,0,0,0.3); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-skip {
    width: 100%;
    padding: 10px;
    background: transparent;
    color: #8b6914;
    border: 1.5px dashed #d4c4a8;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 12px;
    display: none;
  }
  .btn-skip:hover { background: #f5ead0; }
  .msg-box {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .msg-box.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .msg-box.success { display: block; background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .msg-box.info { display: block; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .pwd-tips {
    margin-top: 18px;
    padding: 12px 14px;
    background: #fdf6e3;
    border-radius: 8px;
    font-size: 12px;
    color: #854d0e;
    line-height: 1.7;
  }
  .pwd-tips b { color: #713f12; }
</style>
</head>
<body>
  <div class="pwd-card">
    <div class="pwd-header">
      <div class="pwd-icon">🔐</div>
      <h1 class="pwd-title">修改登录密码</h1>
      <p class="pwd-subtitle force" id="forceTip">首次登录系统，为保障账号安全，请立即修改初始密码</p>
      <p class="pwd-subtitle" id="normalTip" style="display:none;">请输入当前密码并设置新密码</p>
    </div>

    <div class="msg-box" id="msgBox"></div>

    <form id="pwdForm" autocomplete="off">
      <div class="form-group">
        <label for="oldPwd">当前密码</label>
        <input type="password" id="oldPwd" placeholder="请输入当前密码" required />
      </div>
      <div class="form-group">
        <label for="newPwd">新密码</label>
        <input type="password" id="newPwd" placeholder="至少 8 位，含字母和数字" required minlength="8" />
        <div class="pwd-strength" id="pwdStrength"></div>
      </div>
      <div class="form-group">
        <label for="confirmPwd">确认新密码</label>
        <input type="password" id="confirmPwd" placeholder="再次输入新密码" required minlength="8" />
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">✅ 确认修改</button>
      <button type="button" class="btn-skip" id="skipBtn">稍后再说（跳过本次）</button>
    </form>

    <div class="pwd-tips">
      <b>密码规则：</b><br>
      • 长度至少 8 位<br>
      • 建议包含大小写字母、数字和特殊符号<br>
      • 请勿使用与旧密码相同的密码<br>
      • 修改成功后将使用新密码重新登录
    </div>
  </div>

<script src="../js/api-config.js"></script>
  <script src="../js/api-request.js"></script>
<script>
(function(){
  var ADMIN_STORAGE_KEY = 'qaxqjt_admin_session';
  var session = null;
  try { session = JSON.parse(localStorage.getItem(ADMIN_STORAGE_KEY) || 'null'); } catch(_){}
  if (!session) { try { location.replace('login.html'); } catch(_){} return; }

  var isForce = !!session.forcePwdChange;
  document.getElementById('forceTip').style.display = isForce ? 'block' : 'none';
  document.getElementById('normalTip').style.display = isForce ? 'none' : 'block';
  document.getElementById('skipBtn').style.display = isForce ? 'none' : 'block';

  var oldPwdEl = document.getElementById('oldPwd');
  var newPwdEl = document.getElementById('newPwd');
  var confirmPwdEl = document.getElementById('confirmPwd');
  var submitBtn = document.getElementById('submitBtn');
  var msgBox = document.getElementById('msgBox');
  var pwdStrengthEl = document.getElementById('pwdStrength');

  function showMsg(text, type) {
    msgBox.className = 'msg-box ' + (type || 'info');
    msgBox.textContent = text;
  }
  function clearMsg() { msgBox.className = 'msg-box'; msgBox.textContent = ''; }

  function calcStrength(pwd) {
    if (!pwd) return { score: 0, text: '' };
    var score = 0;
    if (pwd.length >= 8) score++;
    if (pwd.length >= 12) score++;
    if (/[a-z]/.test(pwd)) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/\d/.test(pwd)) score++;
    if (/[^a-zA-Z0-9]/.test(pwd)) score++;
    var text = '弱', cls = 'weak';
    if (score >= 4) { text = '中'; cls = 'medium'; }
    if (score >= 5) { text = '强'; cls = 'strong'; }
    return { score: score, text: '密码强度：' + text, cls: cls };
  }

  newPwdEl.addEventListener('input', function() {
    var s = calcStrength(newPwdEl.value);
    pwdStrengthEl.textContent = s.text;
    pwdStrengthEl.className = 'pwd-strength ' + s.cls;
  });

  document.getElementById('pwdForm').addEventListener('submit', function(e) {
    e.preventDefault();
    clearMsg();
    var oldPwd = oldPwdEl.value.trim();
    var newPwd = newPwdEl.value.trim();
    var confirmPwd = confirmPwdEl.value.trim();

    if (!oldPwd) { showMsg('请输入当前密码', 'error'); oldPwdEl.focus(); return; }
    if (!newPwd || newPwd.length < 8) { showMsg('新密码至少 8 位', 'error'); newPwdEl.focus(); return; }
    if (newPwd !== confirmPwd) { showMsg('两次输入的新密码不一致', 'error'); confirmPwdEl.focus(); return; }
    if (newPwd === oldPwd) { showMsg('新密码不能与当前密码相同', 'error'); newPwdEl.focus(); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ 提交中...';

    var api = window.QAXQJT_API;
    if (!api || typeof api.changeMyPwd !== 'function') {
      submitBtn.disabled = false;
      submitBtn.textContent = '✅ 确认修改';
      showMsg('API 模块未加载，请检查 api-request.js', 'error');
      return;
    }

    api.changeMyPwd(oldPwd, newPwd).then(function(resp) {
      // 成功：更新 session 中的 forcePwdChange，跳转 index.html
      try {
        var sess = JSON.parse(localStorage.getItem(ADMIN_STORAGE_KEY) || '{}');
        sess.forcePwdChange = false;
        localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(sess));
      } catch(_) {}
      showMsg('密码修改成功！正在跳转...', 'success');
      setTimeout(function() {
        try { location.replace('index.html'); } catch(_){}
      }, 1200);
    }).catch(function(err) {
      submitBtn.disabled = false;
      submitBtn.textContent = '✅ 确认修改';
      var msg = '密码修改失败，请重试';
      try {
        if (err && err.message) msg = String(err.message);
        else if (err && typeof err === 'string') msg = err;
      } catch(_){}
      showMsg(msg, 'error');
    });
  });

  // 跳过按钮（非强制改密时显示）
  document.getElementById('skipBtn').addEventListener('click', function() {
    try { location.replace('index.html'); } catch(_){}
  });
})();
</script>
</body>
</html>

  <script>try{(function(){
    var K1="qaxqjt_admin_session", K2="qaxqjt_logout_blacklist", L="login.html";
    var p=String(location.pathname||"").split("/").pop().toLowerCase();
    if(p==="login.html"||p==="recover.html") return;

      bad=0;

    }
    if(bad){
      ["qaxqjt_admin_session","admin_session","qaxqjt_admin_sess_v2","admin_sess_v2","qaxqjt_admin_remember","qaxqjt_admin_token","qaxqjt_admin_info","qaxqjt_admin_permissions","qaxqjt_auth_permissions_v1"].forEach(function(k){ try{ localStorage.removeItem(k); }catch(_){} });
      var u=location.href, i=u.lastIndexOf("/");
      var base= (i>=0)? u.substring(0,i+1) : "./";
      location.replace(base + L);
    }
  })();}catch(E){ try{ location.replace("login.html"); }catch(_){} }</script>

      var el = document.createElement('div');
      el.textContent = msg;
      el.style.cssText = 'position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10000;padding:10px 22px;border-radius:10px;font-size:.88rem;color:#fff;background:' + (type === 'error' ? '#dc2626' : '#16a34a') + ';box-shadow:0 8px 24px rgba(0,0,0,.2);';
      document.body.appendChild(el);
      setTimeout(function () { try { el.remove(); } catch (_) {} }, 2600);
    }

    // —— 自定义确认弹窗（原生 confirm 会被全局拦截器吞掉）——
    function showConfirm(msg, onOk) {
      var mask = document.getElementById('__assetConfirmMask');
      document.getElementById('__assetConfirmMsg').textContent = msg;
      mask.style.display = 'flex';
      var ok = document.getElementById('__assetConfirmOk');
      var cancel = document.getElementById('__assetConfirmCancel');
      function cleanup() { mask.style.display = 'none'; ok.onclick = null; cancel.onclick = null; }
      ok.onclick = function () { cleanup(); onOk && onOk(); };
      cancel.onclick = cleanup;
    }

    function load() {
      var A = api();
      if (!A) { notify('API 未就绪', 'error'); return; }
      A.get('/v1/site-assets', { query: {}, showErrorToast: false, timeoutMs: 12000 }).then(function (rows) {
        rows = Array.isArray(rows) ? rows : (rows && rows.rows) || [];
        state.values = {}; state.meta = {};
        rows.forEach(function (r) {
          state.values[r.key] = r.value || '';
          state.meta[r.key] = r;
        });
        state.loaded = true;
        render();
      }).catch(function (e) {
        document.getElementById('assetContainer').innerHTML =
          '<div style="padding:40px;text-align:center;color:#dc2626;">加载失败：' + esc(e && e.message || e) + '</div>';
      });
    }

    function render() {
      var box = document.getElementById('assetContainer');
      box.innerHTML = '';
      GROUPS.forEach(function (g) {
        var gEl = document.createElement('div');
        gEl.className = 'asset-group';
        var t = document.createElement('h3');
        t.className = 'asset-group-title';
        t.textContent = g.page + '（' + g.slots.length + ' 个图片位）';
        gEl.appendChild(t);
        var grid = document.createElement('div');
        grid.className = 'asset-grid';
        g.slots.forEach(function (slot) { grid.appendChild(renderCard(slot)); });
        gEl.appendChild(grid);
        box.appendChild(gEl);
      });
      // —— 文本配置组 ——
      var tg = document.createElement('div');
      tg.className = 'asset-group';
      var tt = document.createElement('h3');
      tt.className = 'asset-group-title';
      tt.textContent = '💬 微信客服信息维护（文本配置 · ' + TEXT_SLOTS.length + ' 项）';
      tg.appendChild(tt);
      var tgrid = document.createElement('div');
      tgrid.className = 'asset-grid';
      TEXT_SLOTS.forEach(function (slot) { tgrid.appendChild(renderTextCard(slot)); });
      tg.appendChild(tgrid);
      box.appendChild(tg);
    }

    function renderTextCard(slot) {
      var val = state.values[slot.key] || '';
      var meta = state.meta[slot.key] || {};
      var card = document.createElement('div');
      card.className = 'asset-card';

      var head = document.createElement('div');
      head.className = 'asset-card-head';
      head.innerHTML =
        '<div><div class="asset-label">' + esc(slot.label) + '</div>' +
        '<div class="asset-key">' + esc(slot.key) + '</div></div>' +
        '<span class="asset-status ' + (val ? 'custom' : 'def') + '">' + (val ? '已配置' : '默认值') + '</span>';
      card.appendChild(head);

      if (slot.hint) {
        var h = document.createElement('div');
        h.className = 'asset-hint';
        h.textContent = '💡 ' + slot.hint;
        card.appendChild(h);
      }

      var input = document.createElement('input');
      input.className = 'asset-url';
      input.placeholder = '请输入文本内容（保存后前台约 5 分钟内生效）';
      input.value = val;
      input.setAttribute('data-key', slot.key);
      card.appendChild(input);

      var acts = document.createElement('div');
      acts.className = 'asset-actions';
      var bSave = markBtn(document.createElement('button'));
      bSave.className = 'btn btn-success'; bSave.textContent = '💾 保存';
      bSave.setAttribute('data-act', 'save'); bSave.setAttribute('data-key', slot.key);
      var bReset = markBtn(document.createElement('button'));
      bReset.className = 'btn btn-outline-dark'; bReset.textContent = '↩ 恢复默认';
      bReset.setAttribute('data-act', 'reset'); bReset.setAttribute('data-key', slot.key);
      acts.appendChild(bSave); acts.appendChild(bReset);
      card.appendChild(acts);

      if (meta.updatedAt) {
        var m = document.createElement('div');
        m.className = 'asset-meta';
        m.textContent = '更新：' + String(meta.updatedAt).slice(0, 19).replace('T', ' ') + (meta.updatedBy ? ' · ' + meta.updatedBy : '');
        card.appendChild(m);
      }
      return card;
    }

    function renderCard(slot) {
      var val = state.values[slot.key] || '';
      var meta = state.meta[slot.key] || {};
      var card = document.createElement('div');
      card.className = 'asset-card';

      var head = document.createElement('div');
      head.className = 'asset-card-head';
      head.innerHTML =
        '<div><div class="asset-label">' + esc(slot.label) + '</div>' +
        '<div class="asset-key">' + esc(slot.key) + '</div></div>' +
        '<span class="asset-status ' + (val ? 'custom' : 'def') + '">' + (val ? '已投放' : '默认图') + '</span>';
      card.appendChild(head);

      var pv = document.createElement('div');
      pv.className = 'asset-preview';
      if (val) {
        var im = document.createElement('img');
        im.src = val; im.alt = slot.label; im.loading = 'lazy';
        im.onerror = function () { pv.innerHTML = '<div class="empty">图片加载失败<br>' + esc(val.slice(0, 60)) + '</div>'; };
        pv.appendChild(im);
      } else {
        pv.innerHTML = '<div class="empty">未投放 · 前台显示页面内置默认图</div>';
      }
      card.appendChild(pv);

      if (slot.hint) {
        var h = document.createElement('div');
        h.className = 'asset-hint';
        h.textContent = '💡 ' + slot.hint;
        card.appendChild(h);
      }

      var input = document.createElement('input');
      input.className = 'asset-url';
      input.placeholder = '图片 URL（上传后自动填入，也可手动粘贴外链）';
      input.value = val;
      input.setAttribute('data-key', slot.key);
      card.appendChild(input);

      var acts = document.createElement('div');
      acts.className = 'asset-actions';
      var bUp = markBtn(document.createElement('button'));
      bUp.className = 'btn btn-primary'; bUp.textContent = '⬆ 上传图片';
      bUp.setAttribute('data-act', 'upload'); bUp.setAttribute('data-key', slot.key);
      var bSave = markBtn(document.createElement('button'));
      bSave.className = 'btn btn-success'; bSave.textContent = '💾 保存';
      bSave.setAttribute('data-act', 'save'); bSave.setAttribute('data-key', slot.key);
      var bReset = markBtn(document.createElement('button'));
      bReset.className = 'btn btn-outline-dark'; bReset.textContent = '↩ 恢复默认';
      bReset.setAttribute('data-act', 'reset'); bReset.setAttribute('data-key', slot.key);
      acts.appendChild(bUp); acts.appendChild(bSave); acts.appendChild(bReset);
      card.appendChild(acts);

      if (meta.updatedAt) {
        var m = document.createElement('div');
        m.className = 'asset-meta';
        m.textContent = '更新：' + String(meta.updatedAt).slice(0, 19).replace('T', ' ') + (meta.updatedBy ? ' · ' + meta.updatedBy : '');
        card.appendChild(m);
      }
      return card;
    }

    function saveKey(key, value, done) {
      var A = api();
      A.put('/v1/site-assets/' + encodeURIComponent(key), { value: value, description: '' }, { timeoutMs: 12000 })
        .then(function () {
          state.values[key] = value;
          try { sessionStorage.removeItem('qaxqjt_site_assets_v1'); } catch (_) {}
          notify(value ? '✅ 保存成功，前台刷新即生效' : '↩ 已恢复默认');
          render();
          done && done();
        })
        .catch(function (e) { notify('保存失败：' + (e && e.message || e), 'error'); });
    }

    function doUpload(key) {
      var fi = document.getElementById('__assetFileInput');
      fi.value = '';
      fi.onchange = function () {
        var f = fi.files && fi.files[0];
        if (!f) return;
        if (f.size > 10 * 1024 * 1024) { notify('图片不能超过 10MB', 'error'); return; }
        var fd = new FormData();
        fd.append('file', f);
        notify('正在上传…');
        api().post('/v1/upload', fd, { timeoutMs: 60000 }).then(function (d) {
          var url = d && (d.url || (d.data && d.data.url));
          if (!url) { notify('上传成功但未返回 URL', 'error'); return; }
          saveKey(key, url);
        }).catch(function (e) { notify('上传失败：' + (e && e.message || e), 'error'); });
      };
      fi.click();
    }

    // —— 事件委托：capture 阶段 + stopImmediatePropagation（防全局拦截器吞点击）——
    document.getElementById('assetContainer').addEventListener('click', function (ev) {
      var b = ev.target && ev.target.closest ? ev.target.closest('button[data-act]') : null;
      if (!b) return;
      ev.preventDefault();
      ev.stopImmediatePropagation();
      var key = b.getAttribute('data-key');
      var act = b.getAttribute('data-act');
      if (act === 'upload') { doUpload(key); return; }
      if (act === 'save') {
        var input = document.querySelector('input.asset-url[data-key="' + key + '"]');
        var v = input ? input.value.trim() : '';
        if (key.indexOf('site.text.') !== 0 && v && !/^(https?:\/\/|\/|data:image\/)/i.test(v)) { notify('请输入合法的图片 URL（http/https 开头）', 'error'); return; }
        if (key.indexOf('site.text.') === 0 && v.length > 200) { notify('文本内容不能超过 200 字', 'error'); return; }
        saveKey(key, v);
        return;
      }
      if (act === 'reset') {
        var isText = key.indexOf('site.text.') === 0;
        showConfirm('确定恢复「' + key + '」为' + (isText ? '默认文本吗？已配置的内容将不再显示。' : '页面默认图吗？已投放的图片将不再显示。'), function () {
          saveKey(key, '');
        });
        return;
      }
    }, true);

    document.getElementById('btnRefresh').addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopImmediatePropagation(); load();
    }, true);

    // —— 退出登录 ——
    (function () {
      var btn = document.getElementById('logoutBtnSidebar');
      if (!btn) return;
      btn.addEventListener('click', function (ev) {
        ev.preventDefault();
        try { window.QinApp.Admin.logout(); } catch (_) {
          try { localStorage.removeItem('qaxqjt_admin_session'); } catch (_) {}
          location.replace('login.html');
        }
      });
    })();

    window.__assetsApi = { load: load, state: state };
    load();
  })();
  </script>
</body>
</html>

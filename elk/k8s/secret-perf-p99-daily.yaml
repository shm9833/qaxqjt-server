# ==================================================================
#   秦安县秦剧团 · Admin Perf P99 日报
#   Kubernetes Secret · 敏感配置
# ==================================================================
#   ⚠️ 重要提示：
#     1. 此文件仅为【模板】，含有占位符 Base64（不是真实密码）
#     2. 绝对不能把真实 base64 编码后的密码提交到 Git 仓库
#     3. 推荐生产用 kubectl create secret generic 命令现场生成：
#
#  # 一键生成方式（推荐，避免明文写在本 YAML）：
#  kubectl -n qaxqjt-monitoring create secret generic qaxqjt-perf-p99-daily-secret \
#    --from-literal=es_password='你的ES真实密码' \
#    --from-literal=smtp_password='你的SMTP授权码（不是登录密码）'
#
#     4. 如走 GitOps（ArgoCD/Flux）请用 SealedSecret / ExternalSecret / Vault 等密钥管理方案
# ==================================================================
apiVersion: v1
kind: Secret
metadata:
  name: qaxqjt-perf-p99-daily-secret
  namespace: qaxqjt-monitoring
  labels:
    app.kubernetes.io/name: qaxqjt-perf-p99
    app.kubernetes.io/component: daily-report-mailer
type: Opaque
# ---- 模板占位（两行均是占位文本 "PLACEHOLDER__CHANGE_ME" 的 base64，直接用不会成功）----
# 实际部署时，要么删除下面 data 整段，改用上面 kubectl create secret 命令；
# 要么手工把下面两个值 echo -n "真实密码" | base64 替换（切勿提交到Git）。
data:
  es_password:   UExBQ0VIT0xERVJfX0NIQU5HRV9NRQ==   # base64("PLACEHOLDER__CHANGE_ME") ← 换成 ES 密码 base64
  smtp_password: UExBQ0VIT0xERVJfX0NIQU5HRV9NRQ==   # base64("PLACEHOLDER__CHANGE_ME") ← 换成 SMTP 授权码 base64

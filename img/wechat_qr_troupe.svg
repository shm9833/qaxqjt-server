      <rect x="66" y="126" width="6" height="6"/><rect x="90" y="132" width="6" height="6"/><rect x="108" y="126" width="6" height="6"/><rect x="126" y="132" width="6" height="6"/><rect x="144" y="126" width="6" height="6"/><rect x="180" y="132" width="6" height="6"/>

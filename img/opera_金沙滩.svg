<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdebd0"/>
      <stop offset="100%" stop-color="#f0b27a"/>
    </linearGradient>
    <linearGradient id="gold7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ac0d"/>
      <stop offset="100%" stop-color="#784212"/>
    </linearGradient>
    <linearGradient id="sky7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aed6f1"/>
      <stop offset="100%" stop-color="#d6eaf8"/>
    </linearGradient>
  </defs>
  <!-- 天空背景 -->
  <rect width="800" height="260" fill="url(#sky7)"/>
  <!-- 沙滩 -->
  <path d="M0,260 Q200,250 400,255 Q600,260 800,250 L800,450 L0,450 Z" fill="#f4d03f"/>
  <path d="M0,290 Q200,280 400,285 Q600,290 800,280 L800,450 L0,450 Z" fill="#d4ac0d" opacity="0.6"/>
  <!-- 河水 -->
  <path d="M0,250 L800,240 L800,260 L0,270 Z" fill="#2e86c1" opacity="0.7"/>
  <!-- 双龙会营帐 -->
  <g transform="translate(180,210)">
    <path d="M-60,60 L0,-40 L60,60 Z" fill="#922b21" stroke="#641e16" stroke-width="2"/>
    <path d="M-55,60 L0,-32 L55,60 Z" fill="#c0392b"/>
    <!-- 旗杆 -->
    <line x1="0" y1="-50" x2="0" y2="-85" stroke="#5d4037" stroke-width="3"/>
    <!-- 帅旗：杨 -->
    <path d="M0,-85 L50,-78 L0,-70 Z" fill="#641e16"/>
    <text x="25" y="-75" text-anchor="middle" font-family="STXingkai,KaiTi,serif" font-size="14" fill="#f4d03f" font-weight="bold">楊</text>
  </g>
  <!-- 大郎替主 -->
  <g transform="translate(400,290)">
    <!-- 皇帝銮驾 -->
    <rect x="-50" y="-30" width="100" height="15" fill="#f1c40f"/>
    <!-- 大郎（杨延平） -->
    <ellipse cx="0" cy="-65" rx="35" ry="55" fill="#6c3483"/>
    <circle cx="0" cy="-120" r="25" fill="#f8dcc4"/>
    <!-- 九龙冠 -->
    <path d="M-25,-140 L25,-140 L30,-150 L-30,-150 Z" fill="#f1c40f"/>
    <circle cx="-20" cy="-148" r="4" fill="#c0392b"/>
    <circle cx="0" cy="-152" r="5" fill="#e74c3c"/>
    <circle cx="20" cy="-148" r="4" fill="#c0392b"/>
  </g>
  <!-- 战斗：武将群体 -->
  <g transform="translate(620,310)">
    <!-- 武将1：持枪 -->
    <ellipse cx="-20" cy="0" rx="22" ry="40" fill="#7b241c"/>
    <circle cx="-20" cy="-45" r="16" fill="#f8dcc4"/>
    <line x1="-20" y1="-30" x2="20" y2="-100" stroke="#784212" stroke-width="4"/>
    <path d="M15,-100 L30,-110 L20,-92 Z" fill="#aab7b8"/>
    <!-- 武将2：使刀 -->
    <ellipse cx="30" cy="5" rx="22" ry="40" fill="#1e8449"/>
    <circle cx="30" cy="-42" r="16" fill="#f8dcc4"/>
    <line x1="30" y1="-25" x2="70" y2="-70" stroke="#784212" stroke-width="3"/>
    <path d="M60,-75 L85,-65 L75,-55 Z" fill="#d7dbdd"/>
  </g>
  <!-- 杨令公 -->
  <g transform="translate(550,260)">
    <ellipse cx="0" cy="20" rx="28" ry="45" fill="#1a5276"/>
    <circle cx="0" cy="-35" r="20" fill="#f8dcc4"/>
    <path d="M-18,-18 Q0,15 18,-18 L20,0 Q0,35 -20,0 Z" fill="#f1f1f1"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="STXingkai,KaiTi,serif" font-size="28" fill="url(#gold7)" font-weight="bold" letter-spacing="8">《金沙滩》· 双龙会</text>
</svg>
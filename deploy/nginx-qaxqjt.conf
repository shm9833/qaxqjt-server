#==============================================================================
# 秦安县秦剧团云端预约系统 - Nginx 反向代理配置
#
# 安装方法（在服务器上执行）：
#   sudo cp nginx-qaxqjt.conf /etc/nginx/sites-available/qaxqjt
#   sudo ln -s /etc/nginx/sites-available/qaxqjt /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#==============================================================================

# 后端 API 反向代理
# EdgeOne Pages 前端请求 /api/v1/* → Nginx 转发到 127.0.0.1:3001/v1/*
# StripPrefix /api 由 proxy_pass 的尾斜杠实现

server {
    listen 80;
    server_name _;  # 替换为你的域名或公网IP

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 请求体大小限制（文件上传）
    client_max_body_size 20m;

    #---------- API 反向代理 ----------
    # /api/v1/* → 127.0.0.1:3001/v1/*（StripPrefix /api）
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    #---------- healthz 健康检查（不缓存）----------
    location ~ ^/(api/)?v1/healthz$ {
        proxy_pass http://127.0.0.1:3001/v1/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    #---------- 静态文件代理（可选，如不用 EdgeOne Pages）----------
    # 如直接用 Nginx 托管前端，取消注释并修改 root 路径
    # location / {
    #     root /home/ubuntu/qaxqjt-frontend;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    # }

    #---------- 禁止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
    }
}

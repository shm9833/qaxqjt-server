<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="js/favicon-inject.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 秦安县秦剧团文化演出有限公司</title>
    <meta name="description" content="秦安县秦剧团文化演出有限公司 - 页面未找到">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #FFFAF0 0%, #FDF5E6 50%, #FFFAF0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "KaiTi", "STKaiti", "SimSun", serif;
        }
        .error-container {
            text-align: center;
            padding: 60px 40px;
            max-width: 600px;
        }
        .error-code {
            font-size: 140px;
            font-weight: 900;
            background: linear-gradient(135deg, #8B0000 0%, #D4AF37 50%, #8B0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: 8px;
        }
        .error-title {
            font-size: 32px;
            color: #8B0000;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .error-desc {
            font-size: 17px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .opera-decoration {
            font-size: 80px;
            color: #D4AF37;
            opacity: 0.6;
            margin-bottom: 30px;
            font-family: "KaiTi", serif;
            text-shadow: 2px 2px 8px rgba(212, 175, 55, 0.3);
        }
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-gold {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(135deg, #D4AF37 0%, #F4E5B2 50%, #D4AF37 100%);
            color: #5C4A1F;
            border: 2px solid #D4AF37;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        .btn-outline {
            display: inline-block;
            padding: 14px 36px;
            background: transparent;
            color: #8B0000;
            border: 2px solid #8B0000;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-outline:hover {
            background: #8B0000;
            color: #fff;
        }
        .footer-note {
            margin-top: 60px;
            font-size: 13px;
            color: #999;
        }
        .footer-note span {
            color: #8B0000;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="opera-decoration">戯</div>
        <div class="error-code">404</div>
        <h1 class="error-title">一曲未终，页面难寻</h1>
        <p class="error-desc">
            您访问的页面似乎已被撤下幕布，<br>
            或许是剧目换场，又或是路径迷途。<br>
            请返回首页，精彩大戏仍在继续上演！
        </p>
        <div class="error-actions">
            <a href="index.html" class="btn-gold">🏠 返回首页</a>
            <a href="booking.html" class="btn-outline">🎫 立即预约</a>
            <a href="contact.html" class="btn-outline">📞 联系我们</a>
        </div>
        <div class="footer-note">
            © <span>{year}</span> 秦安县秦剧团文化演出有限公司 版权所有 &nbsp;|&nbsp; 传承陇原秦韵，唱响乡土华章
        </div>
    </div>
    <script src="js/year-lite.js"></script>
</body>
</html>
